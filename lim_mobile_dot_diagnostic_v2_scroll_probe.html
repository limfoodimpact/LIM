<!doctype html><html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LIM Mobile Scroll Probe V2</title>
<style>
:root{--n:#1F4E79;--g:#E8C97A;--m:#718493}*{box-sizing:border-box}
html,body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif;color:var(--n)}
header{position:fixed;top:0;left:0;right:0;height:54px;z-index:30;background:#fffffff2;border-bottom:1px solid #edf1f3;display:flex;align-items:center;justify-content:space-between;padding:0 15px}
.logo{font-weight:900;letter-spacing:.15em}.status{font-size:9px;color:var(--m)}
.intro,.after{height:100svh;min-height:580px;display:grid;place-items:center;text-align:center;padding:70px 24px 20px}
h1{font-size:38px;line-height:1.1;letter-spacing:-.05em}.sub{font-size:13px;color:var(--m);line-height:1.7}
.test{height:320svh;position:relative}
.stage{position:sticky;top:54px;height:calc(100svh - 54px);overflow:hidden;background:white}
.rail{position:absolute;left:29px;top:8%;bottom:8%;width:3px;background:#dce7ed;border-radius:4px}
.dot{position:absolute;left:30.5px;top:8%;width:24px;height:24px;border-radius:50%;background:var(--g);border:3px solid white;box-shadow:0 0 0 8px #e8c97a47,0 0 24px #e8c97a88;transform:translate(-50%,-50%);z-index:10}
.start,.end{position:absolute;left:56px;font-size:10px;font-weight:900;letter-spacing:.12em;color:#8a9aa4}.start{top:7%}.end{bottom:7%}
.center{position:absolute;left:75px;right:18px;top:45%;text-align:center}.center b{font-size:28px}.center p{font-size:12px;color:var(--m);line-height:1.7}
.debug{position:fixed;right:8px;bottom:8px;z-index:50;background:#ffffffed;border:1px solid #e5ecef;border-radius:10px;padding:7px 9px;font:9px/1.45 ui-monospace,monospace;color:#687b88;text-align:right}
.after{background:linear-gradient(#fff,#FFF6E9)}
</style></head><body>
<header><div class="logo">LIM</div><div class="status" id="status">SCROLL PROBE V2</div></header>
<section class="intro"><div><div style="font-size:25px;color:#E8C97A">●</div><h1>스크롤 신호부터<br>확인합니다.</h1><div class="sub">이번에는 요소 위치가 아니라 실제 페이지 scrollY를 직접 사용합니다.</div></div></section>
<section class="test" id="test"><div class="stage">
<div class="rail"></div><div class="dot" id="dot"></div><div class="start">START</div><div class="end">END</div>
<div class="center"><b>● → scrollY</b><p>스크롤하면 점이 움직이고<br>오른쪽 아래 숫자도 바뀌어야 합니다.</p></div>
</div></section>
<section class="after"><div><b>END</b><div class="sub">여기까지 내려오면 테스트 종료입니다.</div></div></section>
<div class="debug" id="debug">waiting…</div>
<script>
(()=>{
 const dot=document.getElementById('dot'),test=document.getElementById('test'),
       debug=document.getElementById('debug'),status=document.getElementById('status');
 const clamp=v=>Math.max(0,Math.min(1,v));
 let lastY=-1,frames=0;

 function update(){
   const y=window.pageYOffset || document.documentElement.scrollTop || document.body.scrollTop || 0;
   const top=test.offsetTop;
   const range=Math.max(1,test.offsetHeight-window.innerHeight);
   const p=clamp((y-top)/range);
   dot.style.top=(8+p*84)+'%';
   frames++;
   debug.textContent='scrollY '+Math.round(y)+'px\nprogress '+Math.round(p*100)+'%\nupdates '+frames;
   status.textContent=p>0&&p<1?'MOVING '+Math.round(p*100)+'%':p>=1?'END':'SCROLL PROBE V2';
   lastY=y;
 }
 // Multiple mobile-safe signals; all feed one deterministic renderer.
 window.addEventListener('scroll',update,{passive:true});
 document.addEventListener('scroll',update,{passive:true});
 window.addEventListener('touchmove',update,{passive:true});
 window.addEventListener('resize',update,{passive:true});
 setInterval(()=>{
   const y=window.pageYOffset || document.documentElement.scrollTop || document.body.scrollTop || 0;
   if(y!==lastY) update();
 },100);
 requestAnimationFrame(update);
})();
</script></body></html>
