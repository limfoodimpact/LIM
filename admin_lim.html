<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>LIM 운영자 기록실</title>
  <style>
    :root{--navy:#1F4E79;--blue:#3E7CB1;--gold:#E8C97A;--cream:#FFF6E9;--gray:#F2F5F8;--ink:#263746;--muted:#687887;--line:#DCE5EC;--red:#9D3F3D;--green:#267258}
    *{box-sizing:border-box}html{-webkit-text-size-adjust:100%}body{margin:0;background:#F6F8FA;color:var(--ink);font-family:"Pretendard","Malgun Gothic",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.6;word-break:keep-all}button,input{font:inherit}.wrap{width:min(1100px,calc(100% - 28px));margin:auto;padding:28px 0 64px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:20px}.brand{color:var(--navy)}.brand b{display:block;font-size:22px}.brand span{font-size:11px;letter-spacing:.12em}.top-actions{display:flex;gap:8px}.quiet{min-height:44px;border:1px solid var(--line);border-radius:99px;background:#fff;color:var(--navy);padding:9px 15px;font-weight:850;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center}.hero{padding:30px;border-radius:22px;background:linear-gradient(150deg,var(--navy),#173A5B);color:#fff}.hero small{color:var(--gold);font-weight:900;letter-spacing:.13em}.hero h1{margin:9px 0 7px;font-size:clamp(27px,5vw,40px)}.hero p{margin:0;color:#D8E6EF}.panel{margin-top:18px;padding:24px;border:1px solid var(--line);border-radius:20px;background:#fff;box-shadow:0 12px 34px rgba(31,78,121,.06)}h2{margin:0 0 6px;color:var(--navy);font-size:23px}.lead{margin:0 0 20px;color:var(--muted)}label{display:block;margin:16px 0 7px;color:var(--navy);font-weight:900}input{width:100%;min-height:50px;padding:12px 13px;border:1px solid #C8D4DD;border-radius:11px;font-size:16px;outline:none}input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(62,124,177,.13)}.primary{width:100%;min-height:52px;margin-top:20px;border:0;border-radius:99px;background:var(--gold);color:var(--navy);font-weight:900;cursor:pointer}.primary:disabled,.action:disabled{opacity:.55;cursor:not-allowed}.status{min-height:24px;margin:12px 0 0;font-weight:750}.error{color:var(--red)}#console{display:none}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0}.stat{padding:16px;border:1px solid var(--line);border-radius:15px;background:#fff;color:var(--muted);font-size:13px}.stat strong{display:block;color:var(--navy);font-size:27px}.filters{display:flex;gap:7px;overflow-x:auto;padding-bottom:5px}.filter{min-height:42px;white-space:nowrap;border:1px solid var(--line);border-radius:99px;background:#fff;color:var(--navy);padding:8px 14px;font-weight:850;cursor:pointer}.filter.active{background:var(--navy);border-color:var(--navy);color:#fff}.entries{display:grid;gap:11px;margin-top:17px}.entry{display:grid;grid-template-columns:minmax(150px,1.3fr) minmax(135px,.8fr) minmax(170px,1fr) auto;gap:14px;align-items:center;padding:17px;border:1px solid var(--line);border-radius:16px;background:#fff}.entry-name{color:var(--navy);font-size:18px;font-weight:900}.entry-id{color:var(--muted);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}.badge{display:inline-flex;width:max-content;align-items:center;min-height:31px;padding:5px 10px;border-radius:99px;background:var(--gray);color:var(--navy);font-size:12px;font-weight:900}.badge.pending{background:#FFF4D6;color:#765A12}.badge.approved{background:#E4F3EC;color:var(--green)}.badge.deletion_requested{background:#FBE8E7;color:var(--red)}.badge.rejected{background:#ECEFF2;color:#5F6870}.date{color:var(--muted);font-size:13px}.entry-actions{display:flex;gap:6px;justify-content:flex-end}.action{min-height:42px;border:1px solid var(--line);border-radius:10px;background:#fff;padding:8px 12px;color:var(--navy);font-weight:900;cursor:pointer}.action.approve{background:var(--gold);border-color:var(--gold)}.action.danger{color:var(--red)}.empty{padding:34px;border:1px dashed #C8D4DD;border-radius:16px;background:#fff;color:var(--muted);text-align:center}.privacy{margin-top:17px;color:var(--muted);font-size:13px}.privacy strong{color:var(--navy)}
    @media(max-width:760px){.wrap{width:min(100% - 20px,1100px);padding-top:16px}.top{align-items:flex-start}.top-actions{display:grid}.hero{padding:25px 19px}.panel{padding:20px 16px}.stats{grid-template-columns:repeat(2,1fr)}.entry{grid-template-columns:1fr}.entry-actions{justify-content:stretch}.action{flex:1}.quiet{justify-content:center}.date{font-size:12px}}
  </style>
</head>
<body>
  <main class="wrap">
    <header class="top"><div class="brand"><b>LIM Food Impact</b><span>OPERATOR RECORD ROOM</span></div><div class="top-actions"><a class="quiet" href="./index.html">홈페이지 보기</a><button class="quiet" id="logoutButton" type="button" hidden>로그아웃</button></div></header>
    <section class="hero"><small>선택 · 기록 · 확인</small><h1>LIM 운영자 기록실</h1><p>동의하고 신청한 이름을 확인한 뒤 공개 여부를 결정합니다.</p></section>

    <section class="panel" id="loginPanel" aria-labelledby="loginTitle">
      <h2 id="loginTitle">운영자 로그인</h2><p class="lead">등록된 운영자 계정만 기록을 확인할 수 있습니다.</p>
      <form id="loginForm"><label for="email">이메일</label><input id="email" type="email" autocomplete="username" required><label for="password">비밀번호</label><input id="password" type="password" autocomplete="current-password" required><button class="primary" id="loginButton" type="submit">로그인</button><p class="status" id="loginStatus" role="status" aria-live="polite"></p></form>
    </section>

    <section id="console" aria-labelledby="consoleTitle">
      <div class="stats"><div class="stat">승인 대기<strong id="pendingCount">0</strong></div><div class="stat">공개 중<strong id="approvedCount">0</strong></div><div class="stat">철회 요청<strong id="deletionCount">0</strong></div><div class="stat">전체 기록<strong id="totalCount">0</strong></div></div>
      <div class="panel"><h2 id="consoleTitle">신청 기록</h2><p class="lead">승인한 이름만 홈페이지에 공개됩니다.</p><div class="filters" role="group" aria-label="기록 상태 필터"><button class="filter active" type="button" data-filter="all">전체</button><button class="filter" type="button" data-filter="pending">승인 대기</button><button class="filter" type="button" data-filter="approved">공개 중</button><button class="filter" type="button" data-filter="deletion_requested">철회 요청</button><button class="filter" type="button" data-filter="rejected">거절</button></div><p class="status" id="consoleStatus" role="status" aria-live="polite"></p><div class="entries" id="entries"><div class="empty">기록을 불러오는 중입니다.</div></div><p class="privacy"><strong>운영 원칙:</strong> 이름의 적절성과 공개 동의를 확인한 뒤 승인합니다. 철회 요청은 공개에서 이미 제외되며, 확인 후 완전히 삭제합니다.</p></div>
    </section>
  </main>

  <script>
  (()=>{
    'use strict';
    const BASE='https://slrbqhygpexksvduluev.supabase.co';
    const KEY='sb_publishable_K9fILZLweR1Qi8IBQyNEmA_OMV1F4yb';
    let token=sessionStorage.getItem('lim_admin_token')||'';
    let records=[],filter='all';
    const $=selector=>document.querySelector(selector);
    const loginPanel=$('#loginPanel'),consolePanel=$('#console'),loginStatus=$('#loginStatus'),consoleStatus=$('#consoleStatus'),entries=$('#entries'),logout=$('#logoutButton');
    const setStatus=(el,message,error=false)=>{el.textContent=message;el.classList.toggle('error',error)};
    const escDate=value=>value?new Intl.DateTimeFormat('ko-KR',{dateStyle:'medium',timeStyle:'short'}).format(new Date(value)):'—';
    async function authLogin(email,password){const r=await fetch(`${BASE}/auth/v1/token?grant_type=password`,{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({email,password})});const data=await r.json();if(!r.ok)throw new Error(data.error_description||data.msg||'로그인하지 못했습니다.');return data.access_token}
    async function rpc(name,body={}){const r=await fetch(`${BASE}/rest/v1/rpc/${name}`,{method:'POST',headers:{apikey:KEY,Authorization:`Bearer ${token}`,'Content-Type':'application/json'},body:JSON.stringify(body)});const raw=await r.text();let data=raw;try{data=raw?JSON.parse(raw):null}catch(_){}if(!r.ok){if(r.status===401){signOut();throw new Error('로그인이 만료되었습니다. 다시 로그인해 주세요.')}throw new Error(data?.message||'요청을 처리하지 못했습니다.')}return data}
    function signOut(){token='';sessionStorage.removeItem('lim_admin_token');records=[];consolePanel.style.display='none';loginPanel.style.display='block';logout.hidden=true;$('#password').value=''}
    async function enterConsole(){const allowed=await rpc('is_lim_admin');if(allowed!==true){signOut();throw new Error('이 계정은 LIM 운영자로 등록되지 않았습니다.')}loginPanel.style.display='none';consolePanel.style.display='block';logout.hidden=false;await loadRecords()}
    async function loadRecords(){setStatus(consoleStatus,'기록을 불러오는 중입니다…');try{const data=await rpc('get_admin_lim_entries');records=Array.isArray(data)?data:[];updateStats();render();setStatus(consoleStatus,'')}catch(e){setStatus(consoleStatus,e.message,true)}}
    function updateStats(){$('#pendingCount').textContent=records.filter(x=>x.status==='pending').length;$('#approvedCount').textContent=records.filter(x=>x.status==='approved').length;$('#deletionCount').textContent=records.filter(x=>x.status==='deletion_requested').length;$('#totalCount').textContent=records.length}
    const labels={pending:'승인 대기',approved:'공개 중',deletion_requested:'철회 요청',rejected:'거절',deleted:'삭제'};
    function button(label,action,kind=''){const b=document.createElement('button');b.type='button';b.className=`action ${kind}`.trim();b.textContent=label;b.dataset.action=action;return b}
    function render(){entries.replaceChildren();const list=filter==='all'?records:records.filter(x=>x.status===filter);if(!list.length){const e=document.createElement('div');e.className='empty';e.textContent='해당 상태의 기록이 없습니다.';entries.append(e);return}list.forEach(record=>{const row=document.createElement('article');row.className='entry';row.dataset.id=record.public_id;const who=document.createElement('div');const name=document.createElement('div');name.className='entry-name';name.textContent=record.display_name;const id=document.createElement('div');id.className='entry-id';id.textContent=record.public_id;who.append(name,id);const state=document.createElement('span');state.className=`badge ${record.status}`;state.textContent=labels[record.status]||record.status;const date=document.createElement('div');date.className='date';date.textContent=`신청 ${escDate(record.created_at)}`;const actions=document.createElement('div');actions.className='entry-actions';if(record.status==='pending'){actions.append(button('승인','approve','approve'),button('거절','reject','danger'))}else if(record.status==='approved'){actions.append(button('공개 중지','hide','danger'))}else if(record.status==='deletion_requested'||record.status==='rejected'){actions.append(button('완전 삭제','delete','danger'))}row.append(who,state,date,actions);entries.append(row)})}
    $('#loginForm').addEventListener('submit',async e=>{e.preventDefault();const btn=$('#loginButton');btn.disabled=true;setStatus(loginStatus,'로그인하고 있습니다…');try{token=await authLogin($('#email').value.trim(),$('#password').value);sessionStorage.setItem('lim_admin_token',token);await enterConsole();setStatus(loginStatus,'')}catch(err){setStatus(loginStatus,err.message,true)}finally{btn.disabled=false}});
    logout.addEventListener('click',signOut);
    document.querySelectorAll('.filter').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.filter').forEach(x=>x.classList.remove('active'));b.classList.add('active');filter=b.dataset.filter;render()}));
    entries.addEventListener('click',async e=>{const b=e.target.closest('[data-action]');if(!b)return;const row=b.closest('.entry'),id=row.dataset.id,action=b.dataset.action;const words={approve:'승인',reject:'거절',hide:'공개 중지',delete:'완전 삭제'};if(action==='delete'&&!confirm('이 기록을 완전히 삭제할까요? 삭제 후 되돌릴 수 없습니다.'))return;b.disabled=true;setStatus(consoleStatus,`${words[action]} 처리 중입니다…`);try{const ok=await rpc('review_lim_entry',{p_public_id:id,p_action:action});if(ok!==true)throw new Error('현재 상태가 바뀌어 처리하지 못했습니다.');await loadRecords();setStatus(consoleStatus,`${words[action]} 처리가 완료되었습니다.`)}catch(err){setStatus(consoleStatus,err.message,true)}finally{b.disabled=false}});
    if(token)enterConsole().catch(err=>setStatus(loginStatus,err.message,true));
  })();
  </script>
</body>
</html>
