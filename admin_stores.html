<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>매장 문의 관리 | LIM Food Impact</title><style>*{box-sizing:border-box}body{margin:0;background:#F2F5F8;color:#263746;font-family:Arial,"Malgun Gothic",sans-serif;line-height:1.7;word-break:keep-all}header,main{max-width:850px;margin:auto;padding:20px}header{display:flex;align-items:center;justify-content:space-between;gap:15px}header img{width:170px;max-width:45vw}a{color:#1F4E79}h1,h2,h3{color:#1F4E79;line-height:1.4}h1{font-size:clamp(28px,6vw,40px)}section,article{background:white;border:1px solid #dce5ec;border-radius:20px;padding:26px;margin-bottom:20px}.hero{background:#FFF6E9}.tag{color:#1F4E79;font-weight:bold}label{display:block;font-weight:bold;margin:20px 0 6px}input,select,textarea,button{font:inherit}input:not([type=checkbox]),select,textarea{width:100%;padding:12px;border:1px solid #aebdca;border-radius:10px;background:white;color:#263746}textarea{min-height:100px}button,.cta{display:inline-block;padding:13px 21px;min-height:48px;border:0;border-radius:12px;background:#E8C97A;color:#1F4E79;font-weight:bold;cursor:pointer;text-decoration:none}button:disabled{opacity:.6}input[type=checkbox]{width:22px;height:22px;vertical-align:middle}.note{font-size:14px;color:#526779}.status{white-space:pre-wrap;overflow-wrap:anywhere}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}[hidden]{display:none!important}.trap{position:absolute;left:-10000px}details{background:#f2f5f8;padding:14px;border-radius:12px;margin-top:20px}summary{cursor:pointer}article p{white-space:pre-wrap;overflow-wrap:anywhere}@media(max-width:550px){header,main{padding:14px}section,article{padding:20px}.grid{grid-template-columns:1fr}}</style></head><body><header><a href="./index.html"><img src="./lim-logo.png" alt="LIM Food Impact 홈으로"></a><a href="./index.html">홈으로</a></header><main><section class="hero"><h1>매장 참여 문의 관리</h1><a href="./admin_lim.html">이름 공개 관리 →</a><p class="note">연락처와 메모는 운영자 전용입니다. 접수 후 90일이 지나면 삭제됩니다.</p></section><section id="login"><h2>운영자 로그인</h2><form id="loginForm"><label for="email">이메일</label><input type="email" id="email" required autocomplete="username"><label for="password">비밀번호</label><input type="password" id="password" required autocomplete="current-password"><button>로그인</button></form></section><section id="console" hidden><button id="refresh">새로고침</button> <button id="logout">로그아웃</button><label for="filter">상태</label><select id="filter"><option value="">전체</option><option>새 문의</option><option>상담 중</option><option>참여 확정</option><option>보류</option><option>종료</option></select></section><p id="message" class="status" role="status"></p><div id="records"></div></main><script>const BASE='https://slrbqhygpexksvduluev.supabase.co',KEY='sb_publishable_K9fILZLweR1Qi8IBQyNEmA_OMV1F4yb';const $=s=>document.querySelector(s);let token=sessionStorage.getItem('lim_admin_token')||'',rows=[];function clear(){token='';rows=[];sessionStorage.removeItem('lim_admin_token');$('#records').replaceChildren();$('#console').hidden=true;$('#login').hidden=false}async function rpc(name,body={}){const r=await fetch(BASE+'/rest/v1/rpc/'+name,{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json();if(!r.ok){if(r.status===401||r.status===403)clear();throw Error('요청 실패')}return d}function text(tag,value,parent){const el=document.createElement(tag);el.textContent=value;parent.append(el);return el}function render(){$('#records').replaceChildren();const items=rows.filter(r=>!$('#filter').value||r.status===$('#filter').value);if(!items.length){text('p','해당하는 문의가 없습니다.',$('#records'));return}for(const r of items){const card=document.createElement('article');text('h2',r.store,card);text('p',r.region+' · '+r.food+' · '+r.intent,card);const a=text('a',r.phone,card);a.href='tel:'+r.phone;text('p','접수: '+new Date(r.created_at).toLocaleString('ko-KR')+' / '+r.id,card);text('p',r.question||'문의 내용 없음',card);const status=document.createElement('select');status.setAttribute('aria-label',r.store+' 상담 상태');for(const name of ['새 문의','상담 중','참여 확정','보류','종료']){const o=document.createElement('option');o.textContent=name;status.append(o)}status.value=r.status;card.append(status);const note=document.createElement('textarea');note.value=r.admin_note;note.maxLength=2000;note.setAttribute('aria-label',r.store+' 상담 메모');note.placeholder='상담 메모';card.append(note);const date=document.createElement('input');date.type='date';date.value=r.next_contact||'';date.setAttribute('aria-label','다음 연락 날짜');card.append(date);const save=text('button','변경 저장',card);save.onclick=async()=>{save.disabled=true;try{await rpc('review_store_inquiry',{p_id:r.id,p_status:status.value,p_note:note.value,p_next:date.value||null,p_delete:false});await load();$('#message').textContent='저장했습니다.'}catch{$('#message').textContent='저장하지 못했습니다. 로그인과 연결을 확인해 주세요.'}finally{save.disabled=false}};const del=text('button','완전 삭제',card);del.onclick=async()=>{if(!confirm('이 문의와 연락처를 완전히 삭제할까요? 복구할 수 없습니다.'))return;del.disabled=true;try{await rpc('review_store_inquiry',{p_id:r.id,p_status:r.status,p_note:'',p_next:null,p_delete:true});await load()}catch{$('#message').textContent='삭제하지 못했습니다.';del.disabled=false}};$('#records').append(card)}}async function load(){rows=await rpc('get_store_inquiries');$('#login').hidden=true;$('#console').hidden=false;render()}$('#loginForm').onsubmit=async e=>{e.preventDefault();try{const r=await fetch(BASE+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({email:$('#email').value.trim(),password:$('#password').value})});const d=await r.json();if(!r.ok)throw Error();token=d.access_token;sessionStorage.setItem('lim_admin_token',token);$('#password').value='';await load();$('#message').textContent=''}catch{clear();$('#message').textContent='로그인 정보 또는 운영자 권한을 확인해 주세요.'}};$('#filter').onchange=render;$('#refresh').onclick=()=>load().catch(()=>$('#message').textContent='불러오지 못했습니다. 다시 로그인해 주세요.');$('#logout').onclick=clear;if(token)load().catch(()=>{clear();$('#message').textContent='다시 로그인해 주세요.'});</script></body></html>
